name: AI Task
description: Structured task for the Calapres Shopify repository
title: "[AI Task]: "
labels: ["ai-task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: dropdown
    id: primary_agent
    attributes:
      label: Primary agent
      options:
        - Claude architecture or planning
        - Codex implementation
        - Gemini research or review
        - MCP or tool automation
        - Human or manual
    validations:
      required: true
  - type: textarea
    id: shopify_scope
    attributes:
      label: Shopify scope
      description: Note affected theme, products, collections, markets, policies, or live data.
  - type: textarea
    id: verification
    attributes:
      label: Verification expectations
