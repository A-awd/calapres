# Render Blueprint for the Calapres design service (generation OFF, budget 0).
# Blueprint path when creating it in Render: services/design/deploy/render.yaml
# Creating this Blueprint starts billing: one 0.5c-512mb (Starter) instance plus a 1 GB persistent disk.
# It needs the owner's explicit commercial approval first.
services:
  - type: web
    name: calapres-design
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    # Only changes under rootDir trigger a deploy.
    rootDir: services/design
    # Zero runtime dependencies; jsdom is a test-only devDependency.
    buildCommand: npm ci --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    # One instance only: the ledger is the single budget authority, and a disk prevents scaling anyway.
    disk:
      name: calapres-design-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      # Refuse to start if the disk is not mounted (never fall back to disposable storage).
      - key: REQUIRE_MOUNTED_DATA_DIR
        value: "true"
      - key: SHOPIFY_SHOP
        value: unywbe-ub.myshopify.com
      - key: PROXY_PATH_PREFIX
        value: /apps/calapres-design
      - key: PROXY_BASE_PATH
        value: /proxy
      # Client secret of the dedicated Calapres app (Dev Dashboard > app > Settings). Entered in Render only.
      - key: SHOPIFY_API_SECRET
        sync: false
      # 256-bit random value generated by Render. Rotating it invalidates sessions and receipts.
      - key: SERVICE_SECRET
        generateValue: true
      # Shopify's proxy and Render's edge both sit in front of Node. Confirm with the one-time
      # `proxy_client_chain` log line after the first proxied request, then adjust if needed.
      - key: CLIENT_IP_HEADER
        value: x-forwarded-for
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: IP_REQUESTS_PER_MINUTE
        value: "120"
      - key: JOBS_PER_HOUR
        value: "20"
      - key: MAX_PENDING_JOBS
        value: "4"
      - key: PROVIDER_IMAGES_PER_MINUTE
        value: "5"
      - key: QUEUE_WAIT_MS
        value: "150000"
      - key: LEASE_TTL_MS
        value: "30000"
      # Generation stays OFF. OPENAI_API_KEY, prices, MAX_OUTPUT_TOKENS_PER_IMAGE and a non-zero
      # budget are added last, in Render > calapres-design > Environment, after owner approval.
      - key: GENERATION_ENABLED
        value: "false"
      - key: BUDGET_USD_MICROS
        value: "0"
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2-2026-04-21
      - key: OPENAI_IMAGE_QUALITY
        value: low
